# =============================================================================
# Cara -- UPPER BODY fragment   (composed into cara_full_body.yaml via `include`)
# =============================================================================
# NOT runnable on its own.  Additive content only -- links, joints, dynamics,
# and an `upper_body:` parameter block -- all attaching to `pelvis`.
#
#   U1: rigid torso lump, WELDED above the pelvis (base_to_torso: fixed).
#   U2: neck + rigid head lump.  Neck yaw/roll/pitch joints exist STRUCTURALLY
#       (they belong in the long-term 20-DoF design) but are `locked: true`
#       -- 0 DOF, no servo -- until balance work needs them.
#   no arms / ears / electronics yet.
#
# Every value below is PROVISIONAL.  `upper_body.<part>.<x>` numeric leaves
# become expression symbols (upper_body.head.com_z -> `head_com_z`); MASSES live
# in dynamics.links.<link>.mass (dotted-path sweepable, like the leg links).
# =============================================================================

meta:
  role: fragment
  name: cara_upper_body
  description: >-
    Upper-body fragment. U1 torso lump + U2 neck (locked) & head lump +
    U3 Jetson & battery lumped masses with switchable candidate placement.

# --- provisional design knobs ---------------------------------------------
upper_body:
  torso:
    attach_z: 0.035     # TODO: measured/CAD -- pelvis frame origin -> weld point (up) [m]
    com_x:    0.0        # TODO -- weld -> torso COM, fore/aft [m]
    com_z:    0.075      # TODO -- weld -> torso COM, up [m]
    box_x:    0.11       # TODO -- torso bounding box, fore/aft [m]
    box_y:    0.15       # TODO -- torso bounding box, lateral [m]
    box_z:    0.16       # TODO -- torso bounding box, vertical [m]
  neck:
    base_z:   0.155      # TODO -- torso link frame -> neck base (top of torso) [m]
    length:   0.040      # TODO -- neck base -> the coincident yaw/roll/pitch axes [m]
  head:
    com_x:    0.010      # TODO -- neck axes -> head COM, fore/aft (slight forward) [m]
    com_z:    0.050      # TODO -- neck axes -> head COM, up [m]
    radius:   0.060      # TODO -- head sphere radius for the inertia approx [m]
  arm:                   # U4: rigid passive lump per side (upper arm + forearm + hand + shoulder mechanics)
    mass:       0.180    # TODO -- per arm [kg].  Symmetric: both l_arm and r_arm use this.
    shoulder_x: 0.0      # TODO -- torso frame -> shoulder joint, fore/aft [m]
    shoulder_y: 0.090    # TODO -- torso frame -> LEFT shoulder joint, lateral (mirror negates for right) [m]
    shoulder_z: 0.120    # TODO -- torso frame -> shoulder joint, up [m]
    length:     0.190    # TODO -- shoulder -> hand, along the hanging arm [m]
    com_z:     -0.095    # TODO -- shoulder -> arm COM, down (neutral hang) [m]
    radius:     0.022    # TODO -- arm rod radius for the inertia approx [m]

# --- U3: electronics as explicit lumped masses with SWITCHABLE placement ----
# `mount_from` joints below take their parent link + offset from the named
# preset in `mounts`.  Placement is a DESIGN QUESTION being studied
# (scripts/placement_study.py) -- these defaults are NOT a final choice.
electronics:
  mounts:                              # candidate mount points: {link, x/y/z offset in that link frame} [m]
    pelvis_low:  {link: pelvis, z: -0.030}   # low in the pelvis (near the hips) -- lowest COM
    pelvis_top:  {link: pelvis, z:  0.020}
    torso_low:   {link: torso,  z:  0.015}   # just above the weld
    torso_mid:   {link: torso,  z:  0.075}
    torso_high:  {link: torso,  z:  0.130}   # high in the torso -- worst for COM

  jetson:                              # Jetson Orin Nano Super module + carrier + heatsink
    mass:  0.15     # TODO: measured -- [kg]
    box_x: 0.070    # TODO
    box_y: 0.070    # TODO
    box_z: 0.030    # TODO
    mount: pelvis_low                  # DEFAULT placement -- see placement_study.py

  battery:                             # 2S LiPo ~5000 mAh
    mass:  0.25     # TODO: measured -- [kg]
    box_x: 0.090    # TODO
    box_y: 0.060    # TODO
    box_z: 0.030    # TODO
    mount: pelvis_low                  # DEFAULT placement

  layouts:                             # named whole-electronics layouts to compare
    both_pelvis_low:      {jetson: pelvis_low, battery: pelvis_low}
    battery_low_jetson_torso: {jetson: torso_mid, battery: pelvis_low}
    both_torso_low:       {jetson: torso_low,  battery: torso_low}
    both_torso_mid:       {jetson: torso_mid,  battery: torso_mid}
    both_high:            {jetson: torso_high, battery: torso_high}

# --- structure ------------------------------------------------------------
links:
  - {name: torso,          role: segment}
  - {name: neck_yaw_link,  role: virtual_coupling}   # 3 coincident neck axes,
  - {name: neck_roll_link, role: virtual_coupling}   #   like the hip abstraction
  - {name: head,           role: segment}
  - {name: jetson,         role: segment}            # U3: lumped mass
  - {name: battery,        role: segment}            # U3: lumped mass
  - {name: l_arm,          role: segment}            # U4: rigid passive lump (mirror makes r_arm)

joints:
  - name: base_to_torso
    type: fixed                       # U1: welded. Becomes the waist joint(s) later.
    parent: pelvis
    child: torso
    origin_expr: [0, 0, torso_attach_z]

  # --- neck: 3 DoF in the 20-DoF design, LOCKED at 0 for U2 stability tests ---
  - name: neck_yaw
    type: revolute
    locked: true
    parent: torso
    child: neck_yaw_link
    origin_expr: [0, 0, "neck_base_z + neck_length"]
    axis: [0, 0, 1]
    limits: {lower: -0.79, upper: 0.79}     # TODO: ROM study
    positive_rotation: "nose turns toward +Y (left)"
    purpose: "Neck yaw -- gaze / head-tracking heading. Locked at 0 until balance work."
  - name: neck_roll
    type: revolute
    locked: true
    parent: neck_yaw_link
    child: neck_roll_link
    origin_expr: [0, 0, 0]
    axis: [1, 0, 0]
    limits: {lower: -0.44, upper: 0.44}     # TODO
    positive_rotation: "head tilts so its right side drops"
    purpose: "Neck roll -- head tilt. Locked at 0 until balance work."
  - name: neck_pitch
    type: revolute
    locked: true
    parent: neck_roll_link
    child: head
    origin_expr: [0, 0, 0]
    axis: [0, 1, 0]
    limits: {lower: -0.70, upper: 0.40}     # TODO -- heavy head must not topple forward
    positive_rotation: "nose pitches down"
    purpose: "Neck pitch -- nod / look down. Locked at 0 until balance work."

  # --- U3: electronics welded to a switchable mount point --------------------
  - name: mount_jetson
    type: fixed
    mount_from: electronics.jetson.mount     # parent + origin resolved from electronics.mounts
    child: jetson
  - name: mount_battery
    type: fixed
    mount_from: electronics.battery.mount
    child: battery

  # --- U4: arms as rigid passive masses, WELDED at the shoulder (no articulation).
  #     The shoulder becomes 3 DoF in the 20-DoF design later. mirror -> r_arm.
  - name: l_shoulder
    type: fixed
    parent: torso
    child: l_arm
    origin_expr: [arm_shoulder_x, arm_shoulder_y, arm_shoulder_z]

dynamics:
  links:
    torso:
      is_physical: true
      mass: 1.20                       # TODO: measured/CAD -- shell + internal structure [kg]
      com:  [torso_com_x, 0.0, torso_com_z]
      inertia:
        method: solid_box
        box:  [torso_box_x, torso_box_y, torso_box_z]

    neck_yaw_link:  {is_physical: false}   # virtual coupling link -- no dynamics
    neck_roll_link: {is_physical: false}   # virtual coupling link -- no dynamics

    head:
      is_physical: true
      mass: 0.35                       # TODO: measured/CAD -- plush head + skull + eye mechanics [kg]
      com:  [head_com_x, 0.0, head_com_z]
      inertia:
        method: solid_sphere
        radius: head_radius

    jetson:
      is_physical: true
      mass: jetson_mass                 # single source of truth: electronics.jetson.mass
      com:  [0.0, 0.0, 0.0]             # lumped at the mount point
      inertia:
        method: solid_box
        box:  [jetson_box_x, jetson_box_y, jetson_box_z]

    battery:
      is_physical: true
      mass: battery_mass                # single source of truth: electronics.battery.mass
      com:  [0.0, 0.0, 0.0]
      inertia:
        method: solid_box
        box:  [battery_box_x, battery_box_y, battery_box_z]

    l_arm:                             # mirror -> r_arm (same mass expr -> symmetric).
      is_physical: true
      mass: arm_mass                   # single source of truth: upper_body.arm.mass
      com:  [0.0, 0.0, arm_com_z]      # neutral hang: COM below the shoulder
      inertia:
        method: uniform_rod_z
        length: arm_length
        radius: arm_radius
