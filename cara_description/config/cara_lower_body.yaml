# =============================================================================
# Cara -- LOWER BODY: pelvis + both legs (12 DoF), floating base for standing
# =============================================================================
# This file EXTENDS config/left_leg.yaml (the validated single-leg spec, still
# the single source of truth for one leg) and:
#   * mirrors the left leg (l_*) into a right leg (r_*) through the sagittal
#     (x-z) plane -- see leg_model._apply_mirror;
#   * puts the pelvis on a FLOATING base so the biped can actually stand on the
#     ground under PD control (scripts/stand_check.py);
#   * replaces the single-leg reference poses with bilateral standing poses.
#
# NOT included yet (deliberately): head, ears, arms, waist, Jetson, battery.
# Get the lower-body dynamics stable first, then add those masses and measure
# their effect on balance and torque demand.
#
# SI units throughout. Frame convention inherited: +X fwd, +Y left, +Z up.
# =============================================================================

extends: left_leg.yaml

meta:
  name: cara_lower_body
  schema_version: 2
  description: >-
    Pelvis + left leg (from left_leg.yaml) + mirrored right leg. 12 revolute
    DoF. Floating pelvis. Provisional dynamics; no upper body yet.

# Mirror l_* -> r_* through the x-z plane:
#   position (x, y, z) -> (x, -y, z)
#   axis     (ax,ay,az) -> (-ax, ay, -az)   (axial-vector reflection)
# Joint limits are copied unchanged -- the axis flip keeps +angle meaning the
# same physical thing (e.g. +hip_roll = abduction) on both legs.
mirror:
  source: "l_"
  target: "r_"

# Floating (free) pelvis. The 12 leg joints are PD-actuated; the 6 pelvis DoF
# are not -- standing is only stable if the commanded posture keeps the COM
# over the support polygon.
base:
  type: floating
  rest_pose: stand_nominal     # servos initialise + hold this at reset
  # rest_height is computed per pose by generate_mjcf (feet land on z = 0)

# The pelvis now bridges BOTH hips -- wider, a touch heavier (structure + 6 hip
# servos). Still provisional. Everything else in dynamics.links is inherited
# and mirrored.
dynamics:
  links:
    pelvis:
      mass: 1.10                       # TODO: measured/CAD -- structure + 6 hip servos
      com: [0.0, 0.0, -0.010]
      inertia:
        method: solid_box
        box: [0.12, 0.16, 0.07]        # TODO -- spans both hip axes

analysis:
  # gravity, ground, provisional_total_robot_mass inherited from left_leg.yaml.
  # reference_poses REPLACED (single-leg crouches would just topple the biped).
  # Each keeps  hip_pitch + knee_pitch + ankle_pitch = 0  so soles stay flat,
  # and is symmetric so the COM stays on the mid-sagittal line.
  standing_poses: [stand_nominal, semi_squat, stand_wide]
  hold_seconds: 10

  reference_poses:
    stand_nominal:                     # slight knee bend, feet under the hips
      "*_hip_pitch":   -0.10
      "*_knee_pitch":   0.20
      "*_ankle_pitch": -0.10
    semi_squat:                        # deeper, COM lower, still centred
      "*_hip_pitch":   -0.55
      "*_knee_pitch":   1.10
      "*_ankle_pitch": -0.55
    stand_wide:                        # hips abducted, ankles roll to keep soles flat
      "*_hip_pitch":   -0.10
      "*_knee_pitch":   0.20
      "*_ankle_pitch": -0.10
      "*_hip_roll":     0.15
      "*_ankle_roll":  -0.15

  # --- quasi-static bilateral weight-shift experiment (scripts/weight_shift.py)
  # A transparent frontal-plane IK turns a desired lateral COM target into
  # (hip_roll, ankle_roll) joint targets per leg (feet stay flat + planted, no
  # foot lifting); the existing PD servos track them. All PROVISIONAL.
  weight_shift:
    base_pose: stand_nominal
    amplitude: 0.03            # m, lateral COM target for the demonstration run
    sweep: [0.010, 0.020, 0.030, 0.040, 0.050, 0.060]   # m, sweep of COM target magnitude
    ramp_seconds: 3.0         # smoothstep ramp between COM targets (quasi-static)
    hold_seconds: 3.0         # dwell at each target
    settle_seconds: 1.5       # initial settle before the trajectory starts
    accept:                   # sweep acceptance criteria (a value fails if it breaks any)
      min_support_margin: 0.005     # m, COM must stay this far inside the FULL support polygon
      min_opposite_load_frac: 0.05  # unloaded foot must keep >= this fraction of total weight
      max_pelvis_tilt_deg: 6.0      # |roll| or |pitch| of the pelvis
      max_foot_slip: 0.003         # m, horizontal drift of either foot
      max_torque_frac: 1.0         # actuator torque must stay within +-this * effort limit

  # --- U7: controlled single-foot UNLOADING (scripts/unload_foot.py)
  # Two transparent quasi-static phases, no gain tuning, no RL:
  #   A) the frontal-plane IK from weight_shift shifts the lateral COM target
  #      toward the stance foot (both feet planted);
  #   B) the swing leg is gently shortened (6-DoF foot IK, target raised) until
  #      its vertical load crosses `unloaded_frac_target` -- then the clearance
  #      is FROZEN there (not lifted further).
  # Pre-single-support question: at that point, is the whole-body COM inside the
  # STANCE foot's own polygon (with margin), pelvis near level, feet not slipping,
  # no actuator saturated, and did Fz reach ~0 before the swing foot rose more
  # than `not_lifted_rise`?  All values PROVISIONAL.
  unload_foot:
    base_pose: stand_nominal
    com_sweep: [0.024, 0.027, 0.030, 0.033]   # m, lateral COM target toward the stance foot
    max_unweight_clearance: 0.024  # m, cap on the pelvis-frame swing-foot target rise in phase B
    ramp_seconds: 4.0
    hold_seconds: 2.0
    settle_seconds: 1.5
    # same minimal stance-roll trim as lift_foot (U8) -- unweighting the free foot to
    # ~0 N is itself a near-single-support state and needs it, or Cara topples.
    roll_trim_kp_ankle: 1.6
    roll_trim_kp_hip:   0.8
    roll_trim_kd_ankle: 0.10
    accept:
      unloaded_frac_target: 0.05   # "approaches zero" = unloaded foot Fz <= this fraction of body weight
      not_lifted_rise: 0.005       # m, swing-foot WORLD z rise at the Fz crossing -- below the U8 5-10 mm deliberate lift
      min_stance_margin: 0.005     # m, whole-body COM must stay this far inside the STANCE foot's own polygon
      max_pelvis_tilt_deg: 6.0
      max_foot_slip: 0.006         # m, horizontal drift of either foot over the maneuver
      max_torque_frac: 1.0
      min_stance_corners: 3        # stance sole must keep >= this many ground-contact corners

  # --- U8: first SINGLE-SUPPORT milestone (scripts/lift_foot.py)
  # Reuse U7's shift + unweight, then actually LIFT the free foot a few mm clear
  # of the ground, HOLD briefly in single support, and RETURN to double support.
  # No stepping, no RL.  All values PROVISIONAL.
  lift_foot:
    base_pose: stand_nominal
    com_target: 0.028             # m, lateral COM shift onto the stance foot
    lift_heights: [0.005, 0.007, 0.010]   # m, swing-foot ground clearance to test (roadmap: 5-10 mm)
    ramp_seconds: 4.0
    hold_seconds: 1.5             # single-support dwell ("hold briefly")
    settle_seconds: 1.5
    # a MINIMAL stance-side balance trim on top of the position PD -- without it Cara
    # rolls ~10 deg in single support and catches the swing-foot edge.  PD on the
    # pelvis roll, split between the stance ankle_roll and hip_roll targets (the D
    # term damps the roll oscillation that would otherwise walk the stance foot).
    # A full disturbance-rejecting balance controller is U9; this is just enough to
    # hold still.  With this split the stance ankle stays within +-2.0 N*m; the hard-
    # working joint is the SWING hip_roll (~2.6 of +-3.0 N*m, holding the lifted leg).
    roll_trim_kp_ankle: 1.6       # rad of stance ankle_roll target per rad of pelvis roll
    roll_trim_kp_hip:   0.8       # rad of stance hip_roll target per rad of pelvis roll
    roll_trim_kd_ankle: 0.10     # + per (rad/s) of pelvis roll rate -- damps the roll oscillation that walks the foot
    clearance_gain:     0.012     # closed-loop: d(pelvis-frame clearance cmd) per step per m of world-clearance error
    accept:
      min_lift_clearance: 0.004      # m, the swing foot must actually clear the ground by >= this in the hold
      max_swing_load_frac: 0.03     # swing foot Fz must stay <= this fraction of body weight during the hold
      min_stance_margin: 0.005      # m, whole-body COM inside the STANCE foot's own polygon
      max_pelvis_tilt_deg: 6.0
      max_foot_slip: 0.006          # m, stance-foot horizontal drift DURING the single-support hold
      max_torque_frac: 1.0
      min_stance_corners: 3         # stance sole ground-contact corners during single support
      min_return_corners: 3        # each sole's corners after returning to double support
